[package]
name = "bigtool"
version = "1.3.1"
edition = "2021"
rust-version = "1.70"
description = "Reader and extractor for EA \"EB\" .big archives (NBA LIVE 19 / Ignite engine) with PS4 GNF texture conversion"
license = "MIT"
repository = "https://github.com/thewulf7/bigtool"
keywords = ["ea", "big", "archive", "reverse-engineering", "gnf"]
categories = ["command-line-utilities", "parser-implementations"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
# zlib-rs backend: pure Rust, and the only backend that supports preset-dictionary inflate,
# which chunkzip chunks require (chunk i>0 is compressed against the previous 32 KiB).
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
indicatif = "0.18.6"
memmap2 = "0.9.12"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "bigtool"
path = "src/main.rs"
